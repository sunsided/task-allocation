[package]
name = "task-allocation"
description = "Decentralized multi-agent task allocation: consensus-based bundle algorithm (CBBA) and auctions that converge to conflict-free assignments over delayed, intermittent communication"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunsided/task-allocation"
readme = "README.md"
keywords = ["multi-agent", "task-allocation", "cbba", "auction", "robotics"]
categories = ["algorithms", "science::robotics", "no-std"]

[dependencies]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid.html"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"
